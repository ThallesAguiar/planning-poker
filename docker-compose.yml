services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planning
      POSTGRES_PASSWORD: planning
      POSTGRES_DB: planning_poker
    ports: ['5432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U planning -d planning_poker'], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ['6380:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: planning-pocker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-10000}
      LLM_MAX_REQUESTS_PER_ROUND: ${LLM_MAX_REQUESTS_PER_ROUND:-1}
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health'], interval: 10s, timeout: 5s, retries: 5 }
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    env_file:
      - .env
    ports: ['5173:80']
    depends_on:
      api: { condition: service_healthy }
